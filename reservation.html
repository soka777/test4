<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .reservation-box{
    max-width:960px;
    margin:0 auto;
    border:1px solid var(--ink);
    padding:50px 60px;
  }
  .reservation-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
  }
  .reservation-row{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .btn-write{
    background:#d9d9d9;
    color:var(--ink);
    padding:14px 24px;
    font-size:14px;
    font-weight:600;
  }
  .reservation-row .desc{ font-size:13.5px; color:var(--ink-soft); }
  .reservation-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:44px 0;
  }
  .reservation-search input{
    border:1px solid var(--line);
    padding:12px 16px;
    font-size:13.5px;
    width:260px;
    max-width:60vw;
    font-family:var(--sans);
  }
  .btn-search{
    background:var(--ink);
    color:#fff;
    padding:12px 26px;
    font-size:13.5px;
    border:none;
    font-family:var(--sans);
    cursor:pointer;
  }
  @media (max-width:640px){
    .reservation-box{ padding:36px 24px; }
    .reservation-row{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>

  <div class="reservation-box">

      <a href="#" class="btn-write">예약신청서 작성하기</a>
      <span class="desc">예약신청서를 작성해주세요.</span>
    </div>

    <div class="reservation-title" style="font-size:17px;">내 예약신청서 확인</div>
    <form class="reservation-row reservation-search" onsubmit="return false;">
      <input type="text" placeholder="작성자로 검색하세요">
      <button type="submit" class="btn-search">검색</button>
