<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Newday Film</title>
<meta name="description" content="Newday Film 공식 홈페이지 | 본식영상, 웨딩영상, 스냅, 커머셜을 제작합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ---- 홈 랜딩 페이지 전용 스타일 ---- */
  .hero{
    max-width:960px;
    margin:0 auto;
  }
  .hero .ph{ aspect-ratio:16/9; }
  .hero-tagline{
    text-align:center;
    font-family:var(--serif);
    font-size:38px;
    color:var(--ink);
    margin:36px 0 10px;
  }
  .hero-sub{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:60px;
  }

  .highlight-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    max-width:960px;
    margin:0 auto 70px;
  }
  .highlight-card{
    text-align:center;
    border:1px solid var(--line);
    padding:28px 12px;
    transition:border-color .2s ease;
  }
  .highlight-card:hover{ border-color:var(--ink); }
  .highlight-card .ph{ aspect-ratio:1/1; margin-bottom:14px; }
  .highlight-card .label{ font-size:13px; font-weight:600; }

  .cta-row{
    text-align:center;
    margin-bottom:60px;
  }
  .cta-row a{
    display:inline-block;
    border:1px solid var(--ink);
    padding:14px 34px;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--ink);
    transition:background-color .2s ease, color .2s ease;
  }
  .cta-row a:hover{ background:var(--ink); color:#fff; }

  @media (max-width:700px){
    .highlight-row{ grid-template-columns:repeat(2,1fr); }
    .hero-tagline{ font-size:28px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-word"><a href="index.html">Newday Film</a></div>
  <div class="logo-sub">FILM STUDIO</div>

  <nav class="main-nav">
    <div class="wrap">
      <ul>
        <li class=""><a href="our-story.html">OUR STORY</a></li>
        <li class=""><a href="wedding-film.html">WEDDING FILM</a></li>
        <li class=""><a href="product.html">PRODUCT</a></li>
        <li class=""><a href="reservation.html">RESERVATION</a></li>
      </ul>
    </div>
  </nav>

  <div class="social-row">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Blog">B</a>
    <a href="#" aria-label="KakaoTalk">T</a>
  </div>
</header>


<main class="wrap" style="padding:50px 24px 0;">

  <!-- ▼ 히어로 영상/사진 자리 -->
  <div class="hero">
    <div class="ph" data-label="HERO VIDEO / PHOTO"></div>
  </div>
  <!--
    본인 mp4 영상을 넣으려면 위 <div class="ph" data-label="HERO VIDEO / PHOTO"></div> 를
    지우고 아래 코드로 교체하세요 (video.mp4를 실제 파일명으로 변경, 같은 폴더에 올리기):

    <video autoplay muted loop playsinline style="width:100%; aspect-ratio:16/9; background:#000;">
      <source src="video.mp4" type="video/mp4">
    </video>
  -->

  <h1 class="hero-tagline">Every wedding has a story.</h1>
  <p class="hero-sub">그날의 공기와 표정을 놓치지 않고 담습니다 — Newday Film</p>

  <div class="highlight-row" style="grid-template-columns:repeat(3,1fr); max-width:640px;">
    <a class="highlight-card" href="wedding-film.html">
      <div class="ph" data-label="PHOTO"></div>
      <div class="label">WEDDING FILM</div>
    </a>
    <a class="highlight-card" href="our-story.html">
      <div class="ph" data-label="PHOTO"></div>
      <div class="label">OUR STORY</div>
    </a>
    <a class="highlight-card" href="product.html">
      <div class="ph" data-label="PHOTO"></div>
      <div class="label">PRODUCT</div>
    </a>
  </div>

  <div class="cta-row">
    <a href="reservation.html">예약 문의하기</a>
  </div>
</main>

<footer>
  <div class="footer-info">
    ADDRESS <b>OO시 OO구 OO로 00</b> &nbsp;|&nbsp; TEL <b>010-0000-0000</b>
  </div>
  <div class="copyright">Copyright (C) Newday Film All Rights Reserved.</div>
</footer>

<script src="script.js"></script>
</body>
</html>
