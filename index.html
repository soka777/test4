<main style="padding:50px 0 80px;">

  <!-- ▼ 히어로 영상 자리 (아래 3가지 중 하나를 선택해서 쓰세요) -->

  <!-- [기본] 아직 영상이 없을 때 보이는 자리표시자 -->
  <div class="hero">
    <div class="ph" data-label="HERO VIDEO"></div>
  </div>

  <!--
    [방법 1] 직접 촬영한 mp4 파일 사용:
    위의 <div class="hero">...</div> 전체를 지우고 아래 코드로 교체하세요.
    (video.mp4를 실제 파일명으로 바꾸고, 이 파일과 같은 폴더에 그 영상 파일을 함께 올려주세요)

    <div class="hero">
      <video autoplay muted loop playsinline controls>
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>

    [방법 2] 유튜브에 올린 영상 연결:
    아래 코드로 교체하고, 유튜브 영상 주소에서 ID 부분만 가져와 넣으세요.
    예) https://youtu.be/ABC12345 라면 ID는 "ABC12345" 입니다.

    <div class="hero">
      <iframe
        src="https://www.youtube.com/embed/여기에_영상ID"
        title="Newday Film" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  -->
