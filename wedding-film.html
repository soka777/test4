<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
  .film-list{ max-width:920px; margin:0 auto; }
  .film-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    align-items:center;
    padding:50px 0;
    border-bottom:1px solid var(--line);
  }
  .film-row:first-child{ padding-top:0; }
  .film-row:last-child{ border-bottom:none; }
  .film-row:nth-child(even) .film-row-figure{ order:2; }
  .film-row-figure .ph{ aspect-ratio:4/3; }
  .film-row-figure iframe{ width:100%; aspect-ratio:4/3; display:block; border:0; }
  .film-row-num{
    font-family:'Marck Script', cursive;
    font-size:24px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .film-row-title{
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }
  .film-row-desc{
    font-size:13.5px;
    color:var(--ink-soft);
  }

  @media (max-width:760px){
    .film-row{ grid-template-columns:1fr; gap:20px; padding:36px 0; }
    .film-row:nth-child(even) .film-row-figure{ order:0; }
  }
</style>
</head>

    <!--

      영상ID는 유튜브 주소에서 찾으면 돼요.

    -->
