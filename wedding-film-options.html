<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
<style>
  /* ── 보기 방식 전환 탭 (확정 후 삭제하면 됩니다) ── */
  .switch{ display:flex; justify-content:center; gap:8px; margin:0 0 44px; flex-wrap:wrap; }
  .switch button{
    font:inherit; font-size:13px; letter-spacing:.04em;
    padding:9px 18px; border:1px solid var(--line, #ddd); background:none;
    color:var(--ink, #222); cursor:pointer; border-radius:999px;
  }
  .switch button[aria-pressed="true"]{ background:var(--ink, #222); color:#fff; border-color:var(--ink, #222); }
  .view{ display:none; }
  .view.on{ display:block; }

  .soon{ opacity:.45; cursor:default; }
  .thumb{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#1a1a1a; }
  .playdot{
    width:64px; height:64px; border-radius:50%;
    border:1px solid rgba(255,255,255,.8); background:rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .playdot::after{
    content:""; margin-left:4px; border-style:solid;
    border-width:10px 0 10px 16px; border-color:transparent transparent transparent #fff;
  }

  /* ───────── A. 시네마: 큰 화면 1개 + 아래 필름 스트립 ───────── */
  .stage{ position:relative; background:#000; aspect-ratio:16/9; cursor:pointer; overflow:hidden; }
  .stage img, .stage iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; }
  .stage .playdot{ position:absolute; left:50%; top:50%; margin:-32px 0 0 -32px; width:84px; height:84px; margin:-42px 0 0 -42px; }
  .stage-info{ display:flex; justify-content:space-between; align-items:baseline; padding:18px 2px 26px; gap:16px; }
  .stage-title{ font-family:'Noto Serif KR', serif; font-size:clamp(20px, 3vw, 28px); }
  .stage-sub{ font-size:13px; color:#888; white-space:nowrap; }
  .strip{ display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity; }
  .strip button{
    flex:0 0 clamp(140px, 20vw, 200px); padding:0; border:0; background:none; cursor:pointer;
    text-align:left; scroll-snap-align:start; opacity:.55; transition:opacity .25s;
  }
  .strip button.active, .strip button:hover{ opacity:1; }
  .strip button .thumb{ outline:2px solid transparent; outline-offset:-2px; }
  .strip button.active .thumb{ outline-color:var(--accent, #b08d57); }
  .strip span{ display:block; margin-top:8px; font-size:12.5px; color:var(--ink, #222); line-height:1.4; }

  /* ───────── B. 에디토리얼: 큰 글씨 리스트 + 오른쪽 썸네일 ───────── */
  .rows{ border-top:1px solid var(--line, #ddd); }
  .row{
    display:grid; grid-template-columns:1fr clamp(110px, 18vw, 220px); gap:24px; align-items:center;
    width:100%; padding:22px 0; border:0; border-bottom:1px solid var(--line, #ddd);
    background:none; text-align:left; cursor:pointer; font:inherit; color:var(--ink, #222);
  }
  .row-name{ font-family:'Noto Serif KR', serif; font-size:clamp(22px, 4.2vw, 46px); line-height:1.2; transition:transform .35s ease, color .35s; }
  .row-en{ display:block; margin-top:8px; font-size:12px; letter-spacing:.18em; color:#999; }
  .row .thumb{ filter:grayscale(1); opacity:.7; transition:filter .4s, opacity .4s; }
  .row:hover .row-name, .row:focus-visible .row-name{ transform:translateX(10px); color:var(--accent, #b08d57); }
  .row:hover .thumb, .row:focus-visible .thumb{ filter:none; opacity:1; }
  .row.soon{ cursor:default; }
  .row.soon:hover .row-name{ transform:none; color:inherit; }

  /* ───────── C. 슬라이더: 옆으로 넘기는 큰 카드 ───────── */
  .slider-wrap{ position:relative; }
  .slider{
    display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:4px 0 18px; scrollbar-width:none;
  }
  .slider::-webkit-scrollbar{ display:none; }
  .slide{
    position:relative; flex:0 0 min(82%, 780px); aspect-ratio:16/9; scroll-snap-align:center;
    border:0; padding:0; background:#000; cursor:pointer; overflow:hidden;
  }
  .slide img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .8s ease; }
  .slide:hover img{ transform:scale(1.04); }
  .slide::after{ content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, rgba(0,0,0,.7)); }
  .slide .cap{
    position:absolute; left:22px; right:22px; bottom:18px; z-index:1; text-align:left; color:#fff;
    font-family:'Noto Serif KR', serif; font-size:clamp(16px, 2.4vw, 24px);
  }
  .slide .playdot{ position:absolute; left:50%; top:50%; margin:-32px 0 0 -32px; z-index:1; }
  .slide.soon{ cursor:default; }
  .arrows{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .arrows button{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line, #ccc);
    background:none; font-size:18px; cursor:pointer; color:var(--ink, #222);
  }
  .arrows button:hover{ background:var(--ink, #222); color:#fff; }

  /* ── 영상 팝업 (기존과 동일) ── */
  .video-modal{
    position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.88);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s;
  }
  .video-modal.open{ opacity:1; visibility:visible; }
  .video-modal-inner{ position:relative; width:min(1200px, 100%, calc((100vh - 120px) * 16 / 9)); }
  .video-modal-frame{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .video-modal-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-modal-title{ margin-top:14px; color:#ddd; font-family:'Noto Serif KR', serif; font-size:15px; text-align:center; }
  .video-modal-close{ position:absolute; top:-46px; right:-4px; width:40px; height:40px; background:none; border:0; color:#fff; font-size:32px; line-height:1; cursor:pointer; opacity:.8; }
  .video-modal-close:hover{ opacity:1; }
  body.modal-open{ overflow:hidden; }

  @media (max-width:560px){
    .video-modal{ padding:12px; }
    .row{ gap:14px; padding:16px 0; }
    .stage-sub{ display:none; }
    .slide{ flex-basis:88%; }
    .arrows{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    .slide img, .row-name{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-word"><a href="index.html"><span class="logo-line"><span class="logo-main">NEWDAY</span><span class="logo-tail"> FILM</span></span><span class="logo-script">film</span></a></div>
  <div class="logo-sub">FILM STUDIO</div>

  <nav class="main-nav">
    <div class="wrap">
      <ul>
        <li class=""><a href="our-story.html">OUR STORY</a></li>
        <li class="current"><a href="wedding-film.html">FILM</a></li>
        <li class=""><a href="product.html">PRODUCT</a></li>
        <li class=""><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </nav>

  <div class="social-row">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Blog">B</a>
    <a href="#" aria-label="KakaoTalk">T</a>
  </div>
</header>

<main class="wrap" style="padding:40px 24px 60px;">

  <!-- 비교용 전환 탭: 마음에 드는 방식이 정해지면 이 블록은 삭제됩니다 -->
  <div class="switch" role="group" aria-label="보기 방식">
    <button type="button" data-view="a" aria-pressed="true">A. 시네마</button>
    <button type="button" data-view="b" aria-pressed="false">B. 에디토리얼</button>
    <button type="button" data-view="c" aria-pressed="false">C. 슬라이더</button>
  </div>

  <section class="view on" id="view-a" aria-label="시네마 보기">
    <div class="stage" id="stage"></div>
    <div class="stage-info"><div class="stage-title" id="stageTitle"></div><div class="stage-sub">화면을 누르면 바로 재생돼요</div></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="view" id="view-b" aria-label="에디토리얼 보기">
    <div class="rows" id="rows"></div>
  </section>

  <section class="view" id="view-c" aria-label="슬라이더 보기">
    <div class="slider-wrap">
      <div class="slider" id="slider"></div>
      <div class="arrows">
        <button type="button" id="prev" aria-label="이전">&#8592;</button>
        <button type="button" id="next" aria-label="다음">&#8594;</button>
      </div>
    </div>
  </section>

</main>

<div class="video-modal" id="videoModal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="video-modal-inner">
    <button class="video-modal-close" type="button" aria-label="닫기">&times;</button>
    <div class="video-modal-frame"></div>
    <div class="video-modal-title"></div>
  </div>
</div>

<script src="script.js"></script>
<script>
(function(){
  /* ▼ 영상 목록은 여기 한 곳만 고치면 세 가지 보기에 모두 반영돼요. id가 비어 있으면 '준비 중'으로 표시됩니다. */
  var FILMS = [
    { id:'mMDcSoDcVUw', ko:'더누벨',      en:'THE NOUVELLE' },
    { id:'O7jIuxI-vzY', ko:'라한호텔',    en:'LAHAN HOTEL' },
    { id:'3q2cSSTKyJ4', ko:'더퀸',        en:'THE QUEEN' },
    { id:'0pvO0MH9Zzk', ko:'경주 드림센터', en:'GYEONGJU DREAM CENTER' },
    { id:'Gf1cLUagnro', ko:'경주 황룡원',  en:'GYEONGJU HWANGRYONGWON' },
    { id:'',            ko:'라메르',      en:'LA MER' },
    { id:'',            ko:'포마레',      en:'POMARE' }
  ];

  function $(s){ return document.querySelector(s); }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function thumb(f){
    var img = el('img', 'thumb'); img.alt = f.ko; img.loading = 'lazy';
    if (!f.id) return img;
    img.src = 'https://i.ytimg.com/vi/' + f.id + '/maxresdefault.jpg';
    img.onerror = function(){ img.onerror = null; img.src = 'https://i.ytimg.com/vi/' + f.id + '/hqdefault.jpg'; };
    img.onload = function(){ if (img.naturalWidth <= 120 && img.src.indexOf('maxresdefault') > -1) img.src = 'https://i.ytimg.com/vi/' + f.id + '/hqdefault.jpg'; };
    return img;
  }
  function embed(id, title){
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
    f.title = title;
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    return f;
  }

  /* ── 팝업 ── */
  var modal = $('#videoModal'), frameBox = modal.querySelector('.video-modal-frame'), titleBox = modal.querySelector('.video-modal-title');
  function openModal(f){
    frameBox.innerHTML = ''; frameBox.appendChild(embed(f.id, f.ko));
    titleBox.textContent = f.ko + ' — ' + f.en;
    modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); document.body.classList.add('modal-open');
  }
  function closeModal(){
    modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); document.body.classList.remove('modal-open');
    frameBox.innerHTML = '';
  }
  modal.querySelector('.video-modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  /* ── A. 시네마 ── */
  var stage = $('#stage'), stageTitle = $('#stageTitle'), strip = $('#strip'), current = 0;
  var playable = FILMS.filter(function(f){ return f.id; });
  function showStage(i){
    current = i;
    var f = playable[i];
    stage.innerHTML = '';
    stage.appendChild(thumb(f)); stage.appendChild(el('span', 'playdot'));
    stageTitle.textContent = f.ko + ' — ' + f.en;
    [].forEach.call(strip.children, function(b, k){ b.classList.toggle('active', k === i); });
  }
  stage.addEventListener('click', function(){
    var f = playable[current];
    stage.innerHTML = ''; stage.appendChild(embed(f.id, f.ko)); // 팝업 없이 그 자리에서 재생
  });
  playable.forEach(function(f, i){
    var b = el('button'); b.type = 'button';
    b.appendChild(thumb(f)); b.appendChild(el('span', '', f.ko));
    b.addEventListener('click', function(){ showStage(i); });
    strip.appendChild(b);
  });
  showStage(0);

  /* ── B. 에디토리얼 ── */
  var rows = $('#rows');
  FILMS.forEach(function(f){
    var r = el('button', 'row' + (f.id ? '' : ' soon')); r.type = 'button';
    var t = el('div'); t.appendChild(el('span', 'row-name', f.ko)); t.appendChild(el('span', 'row-en', f.id ? f.en : f.en + ' · 준비 중'));
    r.appendChild(t); r.appendChild(thumb(f));
    if (f.id) r.addEventListener('click', function(){ openModal(f); });
    rows.appendChild(r);
  });

  /* ── C. 슬라이더 ── */
  var slider = $('#slider');
  FILMS.forEach(function(f){
    var s = el('button', 'slide' + (f.id ? '' : ' soon')); s.type = 'button';
    s.appendChild(thumb(f));
    if (f.id) s.appendChild(el('span', 'playdot'));
    s.appendChild(el('span', 'cap', f.id ? f.ko + ' — ' + f.en : f.ko + ' · 준비 중'));
    if (f.id) s.addEventListener('click', function(){ openModal(f); });
    slider.appendChild(s);
  });
  function go(dir){ slider.scrollBy({ left: dir * slider.clientWidth * 0.8, behavior: 'smooth' }); }
  $('#prev').addEventListener('click', function(){ go(-1); });
  $('#next').addEventListener('click', function(){ go(1); });

  /* ── 보기 전환 ── */
  document.querySelectorAll('.switch button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.switch button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === 'view-' + b.dataset.view); });
    });
  });
})();
</script>
</body>
</html>
