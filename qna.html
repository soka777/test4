<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .qna-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .qna-table th{
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--line);
    padding:12px 8px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .qna-table td{
    border-bottom:1px solid var(--line);
    padding:12px 8px;
    color:var(--ink);
  }
  .qna-table td.title{ text-align:left; }
  .qna-table td.title a::before{ content:"→ "; color:var(--ink-faint); }
  .qna-table td.num, .qna-table td.writer, .qna-table td.views{ text-align:center; color:var(--ink-soft); white-space:nowrap; }
  .qna-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:24px;
  }
  .btn-outline{
    border:1px solid var(--line);
    padding:12px 26px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .btn-solid{
    background:var(--brand);
    color:#fff;
    padding:12px 26px;
    font-size:13px;
  }
  .qna-pagination{
    display:flex; justify-content:center; gap:10px;
    margin-top:40px; font-size:13px; color:var(--ink-soft);
  }
  .qna-pagination .active{ color:var(--ink); font-weight:700; }
  @media (max-width:600px){
    .qna-table th:nth-child(1), .qna-table td.num,
    .qna-table th:nth-child(4), .qna-table td.views{ display:none; }
  }
</style>
</head>

  <div class="page-quote" style="margin-bottom:40px;">
    궁금하신 점을 자유롭게 남겨주세요. 확인 후 답변 드리겠습니다.
  </div>

  <!--
    ▼ 실제로 작동하는 Q&A 게시판 (giscus)
    깃허브 Discussions 기반이라 방문자가 실제로 글을 쓰고 목록도 보입니다.
    아래 script 태그의 data-repo, data-repo-id, data-category, data-category-id 값을
    본인 것으로 바꿔야 작동합니다. (설정 방법은 채팅으로 안내드릴게요)
  -->
  <script src="https://giscus.app/client.js"
    data-repo="여기에-사용자명/저장소이름"
    data-repo-id="여기에-repo-id"
    data-category="Q&A"
    data-category-id="여기에-category-id"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="0"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="ko"
    crossorigin="anonymous"
    async>
  </script>
</main>
